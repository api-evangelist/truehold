aid: truehold
name: Truehold
description: 'Truehold is a St. Louis, Missouri-founded residential real estate company
  that buys homes from owners and rents them back to those same owners through a residential
  sale-leaseback, letting a homeowner convert home equity into cash without moving. Launched
  in 2021, the company expanded across the Midwest and into the South and Southwest, and in
  2025 added Truehold Financial, a Jacksonville, Florida-based lending arm offering DSCR
  loans, fix-and-flip financing and other investor lending products. Truehold also transacts
  portfolio sales and multifamily sales with real estate investors. Its public surface is a
  marketing and lead-generation website plus two authenticated web applications for customers
  and borrowers; it publishes no developer program, no API documentation and no
  machine-readable API contract.'
